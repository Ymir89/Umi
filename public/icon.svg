<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f17"/>
      <stop offset="100%" stop-color="#181926"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>

  <!-- Studio Ambient Arc -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#glow)" stroke-width="12" stroke-dasharray="18 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.6"/>

  <!-- Dynamic Gesture Figure Lines / Artist Action -->
  <g filter="url(#shadow)">
    <!-- Head -->
    <circle cx="256" cy="150" r="28" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Spine / Action Line -->
    <path d="M 256 182 C 265 220 280 270 240 330 C 220 360 210 390 205 410" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dynamic Torso & Arm Reach -->
    <path d="M 260 215 C 295 200 340 185 375 160" fill="none" stroke="url(#glow)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 252 225 C 215 240 170 255 135 240" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>

    <!-- Dynamic Legs / Stance -->
    <path d="M 240 330 C 275 355 315 390 345 420" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Artist Compass / Gesture Motion Curves -->
    <path d="M 170 140 C 220 110 300 110 350 140" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.7"/>
    <path d="M 120 370 C 180 430 330 430 390 370" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.7"/>
  </g>

  <!-- Timer indicator dot -->
  <circle cx="375" cy="160" r="10" fill="#10b981"/>
</svg>
